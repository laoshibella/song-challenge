<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Official Music Video Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Quicksand', sans-serif; background-color: #f0f4f8; margin: 0; height: 100vh; display: flex; overflow: hidden; }
        .side-panel { height: 100vh; display: flex; flex-direction: column; width: 50%; }
        .bg-soft-blue { background-color: #e0f2fe; }
        .macaroon-button { transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); border: 4px solid white; cursor: pointer; }
        .macaroon-button:hover { transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .option-correct { background-color: #34D399 !important; color: white !important; border-color: #059669 !important; }
        .option-wrong { background-color: #F87171 !important; color: white !important; border-color: #DC2626 !important; }
        .video-container { width: 100%; height: 100%; background: #000; display: flex; align-items: center; justify-content: center; }
        #player { width: 100%; height: 100%; }
        /* Fullscreen handling */
        :-webkit-full-screen { background: #000; }
        :-moz-full-screen { background: #000; }
        :fullscreen { background: #000; }
    </style>
</head>
<body>

    <!-- Fullscreen Toggle Button -->
    <button onclick="toggleFullScreen()" class="absolute top-4 right-4 z-50 bg-white/80 hover:bg-white backdrop-blur-sm p-3 rounded-full shadow-lg border-2 border-blue-200">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
        </svg>
    </button>

    <div class="side-panel bg-soft-blue p-8 justify-between border-r-8 border-white">
        <h1 class="text-3xl font-bold text-blue-600">🎧 Pop Quiz</h1>
        <div class="flex flex-col gap-6 flex-grow justify-center max-w-xl mx-auto w-full">
            <div class="bg-white p-8 rounded-[40px] shadow-xl border-4 border-white relative flex flex-col items-center">
                <span id="track-count" class="absolute -top-4 left-8 bg-blue-500 text-white px-6 py-2 rounded-full text-sm font-bold shadow-lg">Press Start</span>
                <p id="lyric-box" class="text-2xl font-bold text-gray-800 text-center italic mt-4 mb-6">Ready for some music?</p>
                <button id="play-btn" onclick="playSnippet()" class="hidden bg-emerald-500 text-white hover:bg-emerald-600 px-8 py-3 rounded-full font-bold shadow-lg transition-all">Play Song 🎵</button>
            </div>
            <div id="options-container" class="grid grid-cols-2 gap-4">
                <button onclick="startApp()" class="col-span-2 bg-blue-600 text-white p-8 rounded-3xl font-bold text-3xl shadow-xl hover:bg-blue-700 transition-all">START 🎶</button>
            </div>
        </div>
    </div>

    <div class="side-panel">
        <div class="video-container"><div id="player"></div></div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        const songs = [
            { title: "Flowers", videoId: "G7KNmW9a75Y", start: 8, end: 40, lyric: "I can buy myself _______.", answer: "flowers", options: ["candy", "flowers", "a ring", "diamonds"] },
            { title: "Golden Hour", videoId: "PEM0Vs8jf1w", start: 5, end: 25, lyric: "It was just two _______.", answer: "lovers", options: ["lovers", "friends", "enemies", "teachers"] },
            { title: "Anti-Hero", videoId: "b1kbLwvqugk", start: 40, end: 60, lyric: "It's me, hi, I'm the _______.", answer: "problem", options: ["hero", "problem", "villain", "doctor"] },
            { title: "Dynamite", videoId: "gdZLi9oWNZg", start: 70, end: 90, lyric: "Light it up like _______.", answer: "dynamite", options: ["fireworks", "a candle", "dynamite", "the sun"] },
            { title: "Levitating", videoId: "TUVcZfQe-Kw", start: 15, end: 35, lyric: "My sugarboo, I'm _______.", answer: "levitating", options: ["levitating", "dancing free", "meant to be", "flying high"] },
            { title: "Bad Habits", videoId: "orJSJGHjBLI", start: 85, end: 100, lyric: "My bad habits lead to _______.", answer: "you", options: ["home", "you", "bed", "nothing"] },
            { title: "Dance Monkey", videoId: "q0hyYWKXF0Q", start: 110, end: 130, lyric: "Dance for me, dance for me, _______.", answer: "dance for me", options: ["sing for me", "dance for me", "look at me", "jump for me"] },
            { title: "Perfect", videoId: "2Vv-BfVoq4g", start: 75, end: 100, lyric: "Baby, I'm dancing in the _______.", answer: "dark", options: ["rain", "dark", "street", "light"] },
            { title: "Shake It Off", videoId: "nfWlot6h_JM", start: 37, end: 60, lyric: "Haters gonna _______.", answer: "hate", options: ["play", "shake", "hate", "fake"] },
            { title: "Count On Me", videoId: "6k8cpUkKK4c", start: 20, end: 45, lyric: "You can count on me like _______.", answer: "1 2 3", options: ["A B C", "1 2 3", "do re mi", "4 5 6"] },
            { title: "Shallow", videoId: "eo_efYhYU2A", start: 115, end: 130, lyric: "We're far from the _______ now.", answer: "shallow", options: ["water", "shallow", "ocean", "deep"] },
            { title: "As It Was", videoId: "H5v3kku4y6Q", start: 90, end: 115, lyric: "In this world, it's just _______.", answer: "us", options: ["us", "you", "me", "them"] },
            { title: "Blinding Lights", videoId: "4NRXx6U8ABQ", start: 75, end: 105, lyric: "I'm blinded by the _______.", answer: "lights", options: ["lights", "night", "stars", "fights"] },
            { title: "Espresso", videoId: "eVli-tstM5E", start: 40, end: 60, lyric: "That's that me _______.", answer: "espresso", options: ["espresso", "coffee", "latte", "mocha"] },
            { title: "Watermelon Sugar", videoId: "E07s5ZYygMg", start: 5, end: 30, lyric: "Tastes like _______ on a summer evenin", answer: "strawberries", options: ["strawberries", "watermelon", "cherry", "peach"] }
        ];

        let currentIndex = 0, player;

        function onYouTubeIframeAPIReady() { player = new YT.Player('player', { height: '100%', width: '100%' }); }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }

        function startApp() { document.getElementById('play-btn').classList.remove('hidden'); loadTrack(); }

        function loadTrack() {
            const song = songs[currentIndex];
            document.getElementById('track-count').innerText = `Challenge ${currentIndex + 1} / ${songs.length}`;
            document.getElementById('lyric-box').innerHTML = song.lyric.replace("_______", `<span class="text-blue-500 border-b-4 border-blue-200 px-2 italic">_______</span>`);
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            [...song.options].sort(() => Math.random() - 0.5).forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "macaroon-button bg-white p-6 rounded-3xl font-bold text-gray-700 text-xl shadow-md";
                btn.innerText = opt;
                btn.onclick = () => { 
                    if(opt === song.answer) { 
                        btn.classList.add('option-correct'); 
                        setTimeout(() => { currentIndex++; if(currentIndex < songs.length) loadTrack(); else document.getElementById('lyric-box').innerText = 'Challenge Complete! 🎉'; }, 1000); 
                    } else { btn.classList.add('option-wrong'); setTimeout(() => btn.classList.remove('option-wrong'), 500); } 
                };
                container.appendChild(btn);
            });
            player.cueVideoById({ videoId: song.videoId, startSeconds: song.start, endSeconds: song.end });
        }

        function playSnippet() { 
            const song = songs[currentIndex];
            player.loadVideoById({ videoId: song.videoId, startSeconds: song.start, endSeconds: song.end }); 
        }
    </script>
</body>
</html>
