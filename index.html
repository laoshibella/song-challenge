<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Official Music Video Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: sans-serif; background-color: #f0f4f8; margin: 0; height: 100vh; display: flex; overflow: hidden; }
        .side-panel { height: 100vh; display: flex; flex-direction: column; width: 50%; }
        .video-container { width: 100%; height: 100%; background: #000; display: flex; align-items: center; justify-content: center; position: relative; }
        #player-wrapper { width: 100%; height: 100%; }
        .option-correct { background-color: #34D399 !important; color: white !important; }
        .option-wrong { background-color: #F87171 !important; color: white !important; }
    </style>
</head>
<body>

    <div class="side-panel bg-white p-8 border-r border-gray-200">
        <h1 class="text-2xl font-bold mb-4">🎵 Music Challenge</h1>
        <div id="lyric-box" class="text-xl font-medium mb-6 p-6 bg-gray-100 rounded-xl">Press Start to begin.</div>
        <div id="options-container" class="grid grid-cols-2 gap-3 mb-6"></div>
        <button id="start-btn" onclick="startApp()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold shadow-lg hover:bg-blue-700">START CHALLENGE</button>
    </div>

    <div class="side-panel">
        <div class="video-container" id="video-area">
            <div id="player-wrapper"></div>
            <div id="overlay" class="absolute inset-0 bg-black/80 flex flex-col items-center justify-center text-white p-6 text-center cursor-pointer" onclick="initVideo()">
                <p class="text-lg font-bold">Click here to enable video playback</p>
            </div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        const songs = [
            { title: "Defying Gravity", videoId: "67Q9Jv3-vM0", start: 140, end: 160, lyric: "It's time to try, defying _______.", answer: "gravity", options: ["gravity", "the odds", "logic", "reality"] },
            { title: "Flowers", videoId: "G7KNmW9a75Y", start: 8, end: 40, lyric: "I can buy myself _______.", answer: "flowers", options: ["candy", "flowers", "a ring", "diamonds"] }
        ];

        let player, currentIndex = 0, isReady = false;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player-wrapper', {
                height: '100%', width: '100%',
                playerVars: { 'autoplay': 0, 'controls': 1, 'rel': 0 },
                events: { 'onReady': () => { isReady = true; } }
            });
        }

        function initVideo() {
            if (!isReady) return;
            document.getElementById('overlay').style.display = 'none';
            player.playVideo();
            setTimeout(() => player.pauseVideo(), 500);
        }

        function startApp() {
            document.getElementById('start-btn').classList.add('hidden');
            loadTrack();
        }

        function loadTrack() {
            const song = songs[currentIndex];
            document.getElementById('lyric-box').innerHTML = song.lyric.replace("_______", `<span class="text-blue-600 font-bold underline">_______</span>`);
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            song.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "bg-white p-4 rounded-lg border-2 border-gray-200 font-bold hover:border-blue-500 transition-all";
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(btn, opt);
                container.appendChild(btn);
            });
            player.loadVideoById({ videoId: song.videoId, startSeconds: song.start, endSeconds: song.end });
        }

        function checkAnswer(btn, choice) {
            if (choice === songs[currentIndex].answer) {
                btn.classList.add('option-correct');
                setTimeout(() => {
                    currentIndex = (currentIndex + 1) % songs.length;
                    loadTrack();
                }, 1000);
            } else {
                btn.classList.add('option-wrong');
                setTimeout(() => btn.classList.remove('option-wrong'), 500);
            }
        }
    </script>
</body>
</html>
