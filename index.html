<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pop Quiz Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: sans-serif; background-color: #f0f4f8; margin: 0; height: 100vh; display: flex; overflow: hidden; }
        .side-panel { height: 100vh; display: flex; flex-direction: column; width: 50%; }
        .macaroon-button { transition: all 0.2s; border: 4px solid white; cursor: pointer; }
        .macaroon-button:hover { transform: translateY(-3px); }
        .option-correct { background-color: #34D399 !important; color: white !important; }
        .option-wrong { background-color: #F87171 !important; color: white !important; }
        .video-container { position: relative; width: 100%; height: 100%; background: #000; }
        #player { width: 100%; height: 100%; pointer-events: none; }
    </style>
</head>
<body>

    <div class="side-panel p-8 border-r-8 border-white bg-blue-50">
        <h1 class="text-3xl font-bold text-blue-600 mb-8">🎧 Pop Quiz</h1>
        
        <div class="flex flex-col gap-6 flex-grow justify-center max-w-lg mx-auto w-full">
            <div class="bg-white p-8 rounded-[40px] shadow-xl border-4 border-white text-center">
                <p id="lyric-box" class="text-2xl font-bold text-gray-800 italic mb-6">Press Start to Begin</p>
                <button id="play-btn" onclick="playSnippet()" class="hidden bg-emerald-500 text-white px-8 py-3 rounded-full font-bold shadow-lg hover:bg-emerald-600">Play Song 🎵</button>
            </div>
            <div id="options-container" class="grid grid-cols-2 gap-4">
                <button onclick="startApp()" class="col-span-2 bg-blue-600 text-white p-6 rounded-3xl font-bold text-2xl shadow-xl hover:bg-blue-700">START</button>
            </div>
        </div>
    </div>

    <div class="side-panel">
        <div class="video-container">
            <div id="player"></div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        const songs = [
            { title: "Flowers", videoId: "G7KNmW9a75Y", start: 8, end: 40, lyric: "I can buy myself _______.", answer: "flowers", options: ["candy", "flowers", "a ring", "diamonds"] },
            { title: "Golden (JVKE)", videoId: "PEM0Vs8jf1w", start: 5, end: 25, lyric: "It was just two _______.", answer: "lovers", options: ["lovers", "friends", "enemies", "teachers"] },
            { title: "Anti-Hero", videoId: "b1kbLwvqugk", start: 40, end: 60, lyric: "It's me, hi, I'm the _______.", answer: "problem", options: ["hero", "problem", "villain", "doctor"] },
            { title: "Dynamite", videoId: "gdZLi9oWNZg", start: 70, end: 90, lyric: "Light it up like _______.", answer: "dynamite", options: ["fireworks", "a candle", "dynamite", "the sun"] },
            { title: "Levitating", videoId: "TUVcZfQe-Kw", start: 15, end: 35, lyric: "My sugarboo, I'm _______.", answer: "levitating", options: ["levitating", "dancing free", "meant to be", "flying high"] },
            { title: "Bad Habits", videoId: "orJSJGHjBLI", start: 85, end: 100, lyric: "My bad habits lead to _______.", answer: "you", options: ["home", "you", "bed", "nothing"] },
            { title: "Dance Monkey", videoId: "q0hyYWKXF0Q", start: 110, end: 130, lyric: "Dance for me, dance for me, _______.", answer: "dance for me", options: ["sing for me", "dance for me", "look at me", "jump for me"] },
            { title: "Perfect", videoId: "2Vv-BfVoq4g", start: 75, end: 100, lyric: "Baby, I'm dancing in the _______.", answer: "dark", options: ["rain", "dark", "street", "light"] },
            { title: "Shallow", videoId: "bo_efYhYU2A", start: 115, end: 130, lyric: "We're far from the _______ now.", answer: "shallow", options: ["water", "shallow", "ocean", "deep"] },
            { title: "Soda Pop", videoId: "8L6G-4t_m_w", start: 10, end: 30, lyric: "Pop like _______.", answer: "soda", options: ["water", "soda", "bubbles", "fizz"] },
            { title: "Golden (Huntrx)", videoId: "tZgW1GvM-6c", start: 10, end: 30, lyric: "Everything is _______.", answer: "golden", options: ["golden", "bright", "shining", "beautiful"] },
            { title: "Defying Gravity", videoId: "b8P6YqW2P1A", start: 150, end: 170, lyric: "It's time to try _______.", answer: "defying gravity", options: ["something new", "defying gravity", "flying away", "being me"] }
        ];

        let currentIndex = 0;
        let player, isAnswered = false;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                playerVars: { 'autoplay': 0, 'controls': 0, 'disablekb': 1 },
                events: { 'onStateChange': onStateChange }
            });
        }

        function onStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                setTimeout(() => { player.pauseVideo(); }, (songs[currentIndex].end - songs[currentIndex].start) * 1000);
            }
        }

        function startApp() { document.getElementById('play-btn').classList.remove('hidden'); loadTrack(); }

        function loadTrack() {
            const song = songs[currentIndex];
            isAnswered = false;
            document.getElementById('lyric-box').innerHTML = song.lyric.replace("_______", `<span class="text-blue-500 underline">_______</span>`);
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            song.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "macaroon-button bg-white p-4 rounded-2xl font-bold shadow-md";
                btn.innerText = opt;
                btn.onclick = () => {
                    if(isAnswered) return;
                    if(opt === song.answer) {
                        btn.classList.add('option-correct');
                        isAnswered = true;
                        setTimeout(() => { currentIndex++; if(currentIndex < songs.length) loadTrack(); }, 1500);
                    } else {
                        btn.classList.add('option-wrong');
                    }
                };
                container.appendChild(btn);
            });
            player.cueVideoById({ videoId: song.videoId, startSeconds: song.start });
        }

        function playSnippet() { player.seekTo(songs[currentIndex].start); player.playVideo(); }
    </script>
</body>
</html>
