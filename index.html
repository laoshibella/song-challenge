<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Official Music Video Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: sans-serif; background-color: #f0f4f8; margin: 0; height: 100vh; display: flex; overflow: hidden; }
        .side-panel { height: 100vh; display: flex; flex-direction: column; width: 50%; }
        .video-container { width: 100%; height: 100%; background: #000; position: relative; }
        #player { width: 100%; height: 100%; }
        .macaroon-button { transition: all 0.2s; border: 4px solid white; cursor: pointer; }
        .option-correct { background-color: #34D399 !important; color: white !important; }
        .option-wrong { background-color: #F87171 !important; color: white !important; }
    </style>
</head>
<body>

    <button onclick="toggleFullScreen()" class="absolute top-4 right-4 z-50 bg-white/80 p-3 rounded-full shadow-lg border-2 border-blue-200">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
        </svg>
    </button>

    <div class="side-panel p-8 justify-center border-r-8 border-white bg-blue-50">
        <h1 class="text-3xl font-bold text-blue-600 mb-8">🎧 Pop Quiz</h1>
        <div id="game-ui" class="flex flex-col gap-6">
            <div class="bg-white p-8 rounded-[40px] shadow-xl border-4 border-white">
                <span id="track-count" class="text-sm font-bold text-blue-500">Welcome!</span>
                <p id="lyric-box" class="text-2xl font-bold text-gray-800 italic mt-4 mb-6">Click Start to begin.</p>
                <button id="play-btn" onclick="playSnippet()" class="hidden bg-emerald-500 text-white px-8 py-3 rounded-full font-bold shadow-lg">Play Song 🎵</button>
            </div>
            <div id="options-container" class="grid grid-cols-2 gap-4">
                <button onclick="startApp()" class="col-span-2 bg-blue-600 text-white p-6 rounded-3xl font-bold text-2xl shadow-xl hover:bg-blue-700">START 🎶</button>
            </div>
        </div>
    </div>

    <div class="side-panel">
        <div class="video-container"><div id="player"></div></div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        const songs = [
            { title: "Flowers", videoId: "G7KNmW9a75Y", start: 8, end: 40, lyric: "I can buy myself _______.", answer: "flowers", options: ["candy", "flowers", "a ring", "diamonds"] },
            { title: "Golden Hour", videoId: "PEM0Vs8jf1w", start: 5, end: 25, lyric: "It was just two _______.", answer: "lovers", options: ["lovers", "friends", "enemies", "teachers"] }
        ];

        let currentIndex = 0, player;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '100%',
                width: '100%',
                playerVars: { 'autoplay': 0, 'controls': 1 }
            });
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        }

        function startApp() { 
            document.getElementById('play-btn').classList.remove('hidden'); 
            loadTrack(); 
        }

        function loadTrack() {
            const song = songs[currentIndex];
            document.getElementById('track-count').innerText = `Challenge ${currentIndex + 1} / ${songs.length}`;
            document.getElementById('lyric-box').innerHTML = song.lyric.replace("_______", `<span class="text-blue-500 border-b-4 border-blue-200 px-2">_______</span>`);
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            song.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "macaroon-button bg-white p-6 rounded-3xl font-bold text-gray-700 shadow-md";
                btn.innerText = opt;
                btn.onclick = () => { 
                    if(opt === song.answer) { 
                        btn.classList.add('option-correct'); 
                        setTimeout(() => { currentIndex++; if(currentIndex < songs.length) loadTrack(); }, 1000); 
                    } else { btn.classList.add('option-wrong'); setTimeout(() => btn.classList.remove('option-wrong'), 500); } 
                };
                container.appendChild(btn);
            });
            player.cueVideoById({ 'videoId': song.videoId, 'startSeconds': song.start, 'endSeconds': song.end });
        }

        function playSnippet() { 
            const song = songs[currentIndex];
            player.loadVideoById({ 'videoId': song.videoId, 'startSeconds': song.start, 'endSeconds': song.end }); 
        }
    </script>
</body>
</html>
